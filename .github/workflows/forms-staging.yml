name: Forms staging checks
on:
  pull_request:
    paths: ["forms/**", "pipeline/**", "onboarding/**", ".github/workflows/forms-staging.yml"]
  push:
    paths: ["forms/**", "pipeline/**", "onboarding/**", ".github/workflows/forms-staging.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test forms/tests/*.test.mjs pipeline/*.test.mjs onboarding/*.test.mjs
      - run: node --check onboarding/worker.mjs
      - run: node pipeline/validate-features.mjs
