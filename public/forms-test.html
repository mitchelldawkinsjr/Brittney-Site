<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Contact form staging test</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><style>body{font:16px system-ui;max-width:520px;margin:40px auto;padding:0 18px}label{display:block;margin:14px 0}input,textarea{box-sizing:border-box;width:100%;padding:10px}button{padding:12px 18px}#result{white-space:pre-wrap}</style></head>
<body><h1>Contact form — staging test</h1><p>This test page is not linked from the website. Email notifications are disabled. Test messages are saved to the private staging database.</p>
<form id="contact"><label>Name<input name="name" maxlength="120" required></label><label>Email<input name="email" type="email" maxlength="254" required></label><label>Message<textarea name="message" maxlength="5000" required></textarea></label><label hidden>Website<input name="website" autocomplete="off" tabindex="-1"></label><div class="cf-turnstile" data-sitekey="0x4AAAAAAGLxzxACKN8gQ003" data-action="contact"></div><p><button type="submit">Send test submission</button></p></form><p id="result" role="status"></p>
<script>
const form=document.querySelector("#contact"),result=document.querySelector("#result");
form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;result.textContent="Submitting…";try{const data=new FormData(form);const token=data.get("cf-turnstile-response");if(!token)throw Error("Complete Turnstile first");const response=await fetch("https://esp-brittney-forms-staging.mitchell-dawkinsjr.workers.dev/api/forms/contact",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:data.get("name"),email:data.get("email"),message:data.get("message"),website:data.get("website"),turnstileToken:token})});const body=await response.json();if(!response.ok)throw Error(body.error||"Submission failed");result.textContent="Submission saved. ID: "+body.id;form.reset();}catch(err){result.textContent="Test failed: "+err.message}finally{button.disabled=false;window.turnstile?.reset()}})
</script></body></html>
